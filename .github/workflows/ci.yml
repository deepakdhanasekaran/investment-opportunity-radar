name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: radar, POSTGRES_PASSWORD: radar, POSTGRES_DB: radar}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e '.[dev]'
      - run: ruff check app tests
      - run: pytest -q
      - name: Migrations apply to real Postgres
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
        env: {RADAR_DATABASE_URL: "postgresql+psycopg://radar:radar@localhost:5432/radar"}
      - name: Dependency vulnerability scan
        run: pip-audit
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend/dashboard}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: frontend/dashboard/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env: {RADAR_API_URL: "http://localhost:8000"}
      - run: npm audit --omit=dev --audit-level=high
