[project]
name = "opportunity-radar"
version = "0.1.0"
description = "Self-hosted investment opportunity screening (decision support, no trading)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13",
  "psycopg[binary]>=3.2", "pydantic>=2.7", "pydantic-settings>=2.3", "apscheduler>=3.10,<4",
  "yfinance>=0.2.50", "pandas>=2.2", "httpx>=0.27", "feedparser>=6.0.11",
  "exchange-calendars>=4.5", "slowapi>=0.1.9",
]
[project.optional-dependencies]
sentiment = ["torch>=2.3", "transformers>=4.44"]
dev = ["pytest>=8", "pytest-cov", "ruff", "pip-audit", "respx>=0.21"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["universe/*.csv"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B904", "B905", "E501", "B008", "E702", "E701", "B007"]
